[project]
name = "uplink-parse"
version = "0.2.0"
description = "Add-on for the uplink library with the ability to parse answers"

readme = "README.md"
license = { file = 'LICENSE' }
keywords = ['http', 'api', 'rest', 'client', 'retrofit', 'parse', 'parsing', 'response', 'request']

requires-python = ">=3.10"
dependencies = [
    "attrs>=26.1.0",
    "typing-extensions>=4.0 ; python_full_version < '3.11'",
]

classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]

[project.urls]
Homepage = "https://github.com/M-16gt/uplink-parse"
Repository = "https://github.com/M-16gt/uplink-parse.git"

[project.optional-dependencies]
base = ["uplink>=0.10.0"]
bs4 = [
    "uplink-parse[base]",
    "beautifulsoup4>=4.14.3",
    "lxml>=6.0.2",
    "aiohttp>=3.13.5",
]
parsel = [
    "aiohttp>=3.13.5",
    "parsel>=1.11.0",
    "uplink-parse[base]",
]
all = [
    "uplink-parse[bs4,parsel]",
]


[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv]
dev-dependencies = [
    "build>=1.0.0",
    "mypy>=2.3.1",
    "pre-commit>=4.6.2",
    "pytest>=9.1.1",
    "repomix>=0.5.0",
    "ruff>=0.16.4",
    "scalene>=2.3.0",
    "twine>=4.0.0",
]

[tool.uv.sources]
uplink-parse = { workspace = true }

[tool.hatch.build.targets.wheel]
packages = ["src/uplink_parse"]

[tool.ruff]
target-version = "py310"
line-length = 88

[tool.ruff.lint]
select = [
    "E", "W",   # pycodestyle
    "F",        # Pyflakes
    "I",        # isort (сортировка импортов)
    "B",        # flake8-bugbear
    "UP",       # pyupgrade
    #"D",        # pydocstyle
    "N",        # pep8-naming
    "SIM",      # упрощение кода
    "C4",       # comprehensions
]
ignore = [
    "D100",
    "D104",
    "D107",
    "UP007",
    "UP035",
]
exclude = ["src/uplink_parse/future/*", "examples/*"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.isort]
known-first-party = ["uplink_parse"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
docstring-code-format = true
skip-magic-trailing-comma = false

[tool.mypy]
python_version = "3.10"
strict = true
warn_return_any = true
warn_unused_ignores = true
show_error_codes = true
files = ["src"]
mypy_path = ["src"]
namespace_packages = true
explicit_package_bases = true
ignore_missing_imports = true
exclude = [
    "src/uplink_parse/future/",
]
[[tool.mypy.overrides]]
module = "examples.*"
ignore_errors = true
