repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.4
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format

  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v2.3.1
    hooks:
      - id: mypy
        additional_dependencies:
          - attrs>=26.1.0
        pass_filenames: false
        files: \.pyi?$
        args: [ "src", "--config-file=pyproject.toml" ]
        language: python